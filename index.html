<!doctype html>

<head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<style>
:root{
  --ink:#061822;--deep:#082330;--panel:rgba(10,37,50,.91);--panel2:rgba(18,52,66,.93);
  --gold:#ffd36f;--gold2:#f1b743;--cream:#fff6dc;--muted:#a7c1c4;--line:rgba(255,255,255,.08);
  --green:#79e09e;--red:#ff7c78;--blue:#72d2ff;--violet:#a889ff
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061822;color:var(--cream);font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}button{color:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.42}
#game{position:fixed;inset:62px 0 0;width:100%;height:calc(100% - 62px);display:block;background:#188cb1;touch-action:none}
.top{
  position:fixed;z-index:25;inset:0 0 auto;height:62px;display:flex;align-items:center;gap:12px;padding:0 17px;
  background:linear-gradient(180deg,rgba(13,44,58,.98),rgba(6,27,38,.97));

}
.brandWrap{display:flex;align-items:center;gap:10px;min-width:220px}.brandMark{

}
.brand{font:800 18px Georgia,serif;letter-spacing:1.4px;color:#fff3ce}.edition{font-size:9px;letter-spacing:2.4px;color:#91b7bd;margin-top:2px}
.locationPill{

  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:#d9e7e3;font-size:11px
}
.locationPill b{color:#ffe09a}.spacer{flex:1}.topActions{display:flex;gap:7px;align-items:center}
.top button{
  border:1px solid rgba(255,255,255,.08);border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  padding:8px 10px;font-size:11px;font-weight:700;transition:.18s
}
.top button:hover{transform:translateY(-1px);border-color:rgba(255,211,111,.25)}.hakiOn{color:#ffe28f!important;border-color:#ffd36f66!important;box-shadow:0 0 18px rgba(255,211,111,.08)}
#hud{position:fixed;inset:62px 0 0;z-index:5;pointer-events:none;overflow:hidden}
.card{
  position:absolute;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:17px;box-shadow:0 16px 42px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(16px)
}
.stats{left:17px;top:17px;width:260px;padding:14px 15px}
.profile{display:flex;align-items:center;gap:10px;margin-bottom:12px}.avatar{

}
.profileMeta{min-width:0;flex:1}.profileName{font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profileSub{font-size:10px;color:var(--muted);margin-top:3px}.level{

}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.tiny{font-size:10px;color:var(--muted)}
.bar{height:7px;background:#03131d;border:1px solid rgba(255,255,255,.035);border-radius:99px;overflow:hidden;margin:5px 0 8px;box-shadow:inset 0 2px 5px #0004}
.bar i{display:block;height:100%;width:50%;border-radius:inherit;background:linear-gradient(90deg,#55c979,#9df0af);box-shadow:0 0 11px #5fe18b33}
.bar.energy i{background:linear-gradient(90deg,#52b9ff,#89e9ff);box-shadow:0 0 11px #64cfff33}.bar.xp{height:4px;margin:7px 0 0}.bar.xp i{background:linear-gradient(90deg,#efb53e,#ffe294)}
.wallet{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.06)}.money{font-weight:900;color:#ffd66f}.fruitBadge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;font-size:10px;color:#dfe9e7;background:#ffffff09;border:1px solid #ffffff0f
}
.quest{left:17px;top:230px;width:260px;padding:14px 15px;pointer-events:auto;text-align:left;border:none;color:inherit}
.quest:hover{border:1px solid #ffd36f25}.eyebrow{font-size:9px;letter-spacing:1.8px;text-transform:uppercase;color:#ffd36f;font-weight:900}
.quest b{display:block;font:700 17px Georgia,serif;margin:7px 0 7px;color:#fff3d6}.questText{font-size:11px;color:#c3d5d3;line-height:1.5}.questMeta{display:flex;justify-content:space-between;margin-top:10px;font-size:10px;color:#ffd36f}.questProgress{height:4px;background:#041722;border-radius:99px;margin-top:8px;overflow:hidden}.questProgress i{display:block;height:100%;background:linear-gradient(90deg,#efb640,#ffe196)}
.minimapCard{right:17px;top:17px;width:188px;padding:9px;pointer-events:auto}.minimapTitle{display:flex;justify-content:space-between;align-items:center;padding:1px 3px 8px;font-size:9px;letter-spacing:1px;color:#bad0d0}.minimapTitle b{color:#ffe09a}
#minimap{width:168px;height:126px;display:block;border-radius:10px;border:1px solid rgba(255,255,255,.06);background:#0c6685;box-shadow:inset 0 0 20px #001a2b55}
.boss{top:17px;left:50%;transform:translateX(-50%);width:min(390px,46vw);padding:9px 13px;display:none}.boss .bar{margin:6px 0 0}.boss .bar i{background:linear-gradient(90deg,#ff696c,#ff9a7b)}
.locationBanner{top:90px;left:50%;transform:translateX(-50%);padding:10px 18px;text-align:center;opacity:0;transition:opacity .3s;min-width:240px}.locationBanner.show{opacity:1}.locationBanner b{font:700 20px Georgia,serif}.locationBanner span{display:block;color:#b9d0d0;font-size:9px;letter-spacing:2px;margin-top:3px}
.hotbar{
  left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:7px;padding:8px;pointer-events:auto;
  border-radius:18px;background:linear-gradient(180deg,rgba(8,33,45,.94),rgba(4,23,33,.93))
}
.slot{
  position:relative;width:72px;height:62px;padding:4px;border:1px solid rgba(255,255,255,.08);border-radius:13px;color:#f4eee0;
  background:linear-gradient(180deg,#214d5d,#123441);box-shadow:0 8px 15px #0003,inset 0 1px 0 #ffffff0a;transition:.16s
}
.slot:hover{transform:translateY(-2px);border-color:#ffd36f33}.slot strong{display:block;font-size:21px;line-height:1}.slot span{display:block;font-size:9px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot em{
  position:absolute;left:5px;top:5px;font-style:normal;font-size:8px;padding:2px 4px;border-radius:5px;background:#051c28aa;color:#cde0df
}
.slot.fruitSlot{border-color:#a889ff38;background:linear-gradient(180deg,#3a4965,#1d3348)}
.nav{position:absolute;right:17px;bottom:18px;display:flex;gap:6px;pointer-events:auto}.nav button{
  border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:10px 11px;background:linear-gradient(180deg,rgba(18,55,69,.95),rgba(8,31,42,.95));
  color:#e9f1ed;font-weight:700;font-size:10px;box-shadow:0 8px 20px #0003
}
.nav button:hover{border-color:#ffd36f33}.nav button b{display:block;font-size:16px;margin-bottom:2px}
.toastbox{position:absolute;left:50%;top:145px;transform:translateX(-50%);display:grid;gap:6px;justify-items:center}.toast{
  background:linear-gradient(180deg,rgba(18,56,69,.98),rgba(9,34,44,.98));border:1px solid #ffd36f44;padding:9px 13px;border-radius:10px;
  box-shadow:0 12px 26px #0004;animation:pop .18s;font-size:11px
}.good{color:#a4efb6}.bad{color:#ffb0a5}@keyframes pop{from{opacity:0;transform:translateY(7px)}}
#mobile{display:none}.touch #mobile{display:block}.stickbase{
  position:absolute;left:20px;bottom:26px;width:116px;height:116px;border:2px solid #ffffff18;border-radius:50%;
  background:radial-gradient(circle,#ffffff09,#00151f35);pointer-events:auto;touch-action:none;backdrop-filter:blur(6px)
}.stick{position:absolute;left:37px;top:37px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffbe9,#e5bd6d);box-shadow:0 8px 18px #0004}
.atk{
  position:absolute;right:22px;bottom:88px;width:76px;height:76px;border-radius:50%;background:linear-gradient(180deg,#ffe089,#efb94f);
  border:2px solid #fff8;color:#163640;font-size:26px;pointer-events:auto;box-shadow:0 10px 24px #0004
}
.modalShade{position:fixed;inset:0;z-index:80;background:rgba(2,12,19,.74);display:none;place-items:center;padding:16px;backdrop-filter:blur(8px)}.modalShade.open{display:grid}
.modal{width:min(860px,96vw);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#123b4a,#082733);border:1px solid #ffffff18;border-radius:22px;box-shadow:0 28px 90px #0008}
.modalHead{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid #ffffff0e;background:#0c3341f4;backdrop-filter:blur(12px)}
.modalHead h2{font:700 24px Georgia,serif;margin:0}.modalHead button{width:34px;height:34px;border-radius:10px;border:1px solid #ffffff12;background:#ffffff08}
.modalBody{padding:19px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.sectionTitle{font:700 17px Georgia,serif;color:#fff1cf;margin:20px 0 9px}.sectionTitle:first-child{margin-top:0}
.item{position:relative;overflow:hidden;border:1px solid #ffffff10;border-radius:14px;padding:12px;background:linear-gradient(180deg,#ffffff08,#ffffff035);box-shadow:0 8px 20px #0002}
.item::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,#ffffff22,transparent)}.item h3{margin:7px 0 6px;font-size:14px}.item p{color:var(--muted);font-size:10px;line-height:1.5;min-height:30px}
.item button,.primaryBtn{width:100%;padding:9px;border-radius:9px;border:1px solid #ffffff12;background:#ffffff09;font-weight:800;font-size:10px}.item button:hover,.primaryBtn:hover{border-color:#ffd36f44;background:#ffd36f10}
.gold{color:var(--gold)}.tag{display:inline-block;font-size:8px;padding:3px 6px;border:1px solid #ffffff18;border-radius:999px;color:#bcd1d1;background:#ffffff07}
.r1{color:#d2d8da}.r2{color:#70dba0}.r3{color:#69cfff}.r4{color:#b49bff}.r5{color:#ffbf69}
.spinStage{padding:12px 0 4px;text-align:center}.spinMachine{
  position:relative;margin:12px auto 16px;width:min(560px,100%);height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:18px;
  background:radial-gradient(circle at center,#25495e,#071f2d 75%);border:1px solid #ffd36f26;box-shadow:inset 0 0 50px #0006
}
.spinMachine::before,.spinMachine::after{content:"";position:absolute;top:0;bottom:0;width:110px;z-index:2;pointer-events:none}.spinMachine::before{left:0;background:linear-gradient(90deg,#071f2d,transparent)}.spinMachine::after{right:0;background:linear-gradient(-90deg,#071f2d,transparent)}
.spinFruit{font-size:52px;filter:drop-shadow(0 10px 16px #0006)}.spinName{font:800 20px Georgia,serif}.spinCost{font-size:11px;color:#b9cdcd;margin:8px 0 14px}
.mapSea{margin:4px 0 10px;color:#ffd36f;font:700 16px Georgia,serif}.locked{filter:saturate(.5)}
@media(max-width:850px){
  .top{height:54px;padding:0 10px}.brandWrap{min-width:0}.brandMark{width:33px;height:33px}.brand{font-size:15px}.edition,.locationPill{display:none}
  #game,#hud{inset:54px 0 0;height:calc(100% - 54px)}.topActions button{padding:7px;font-size:9px}
  .stats{left:8px;top:8px;width:215px;padding:11px}.profile{margin-bottom:8px}.avatar{width:35px;height:35px}.quest{left:8px;top:205px;width:215px;padding:11px}
  .minimapCard{right:8px;top:8px;width:146px;padding:7px}.minimapTitle{font-size:8px}#minimap{width:130px;height:98px}
  .hotbar{bottom:12px;gap:3px;padding:6px}.slot{width:52px;height:52px}.slot strong{font-size:17px}.slot span{font-size:8px}.slot em{font-size:7px}
  .nav{right:8px;bottom:142px;flex-direction:column}.nav button{padding:7px 8px}.nav button b{display:inline;margin-right:4px}
  .touch .hotbar{bottom:10px}.touch .nav{bottom:150px}.boss{top:8px;width:min(330px,64vw)}.locationBanner{top:70px}
}
@media(max-width:540px){
  .minimapCard{display:none}.quest{top:197px}.topActions #hakiArm,.topActions #hakiObs{font-size:0}.topActions #hakiArm::after{content:"ARM";font-size:9px}.topActions #hakiObs::after{content:"OBS";font-size:9px}
}
</style>

<body>
<div id="authGate" class="auth-gate">
  <form id="authForm" class="auth-card">
    <div class="auth-logo">✦</div><h1>Fruit Seas</h1><p>Explore dois mares, enfrente bosses, encontre frutas e jogue com outros aventureiros.</p>
    <div class="auth-tabs"><button type="button" id="authLoginTab" class="active">Entrar</button><button type="button" id="authSignupTab">Criar conta</button></div>
    <label id="nameField" class="auth-field hidden"><span>Nome no jogo</span><input id="authName" maxlength="20" autocomplete="nickname" placeholder="Aventureiro"></label>
    <label class="auth-field"><span>E-mail</span><input id="authEmail" type="email" required autocomplete="email" placeholder="voce@email.com"></label>
    <label class="auth-field"><span>Senha</span><input id="authPassword" type="password" minlength="6" required placeholder="••••••••"></label>
    <button id="authSubmit" class="auth-primary">Entrar</button><div id="authMessage" class="auth-message"></div>
  </form>
</div>

<header class="top">
  <div class="brandWrap"><div class="brandMark">✦</div><div><div class="brand">FRUIT SEAS</div><div class="edition">ONLINE ADVENTURE</div></div></div>
  <div class="locationPill"><span>⚓</span><b id="islandTop">Porto Aurora</b><span>•</span><span id="seaLabel">1º Sea</span></div>
  <div class="spacer"></div>
  <div class="topActions"><button id="hakiArm">Armamento <span>[F]</span></button><button id="hakiObs">Observação <span>[G]</span></button></div>
</header>

<canvas id="game"></canvas>
<div id="onlineStatus" class="online-status" hidden><span class="online-dot"></span><span id="onlineCount">1 online</span><span class="online-sep">•</span><span id="onlineUser">Aventureiro</span><button id="logoutBtn">Sair</button></div>

<div id="hud">
  <section class="stats card">
    <div class="profile"><div class="avatar" id="fruitAvatar">🔥</div><div class="profileMeta"><div class="profileName" id="playerName">Aventureiro</div><div class="profileSub">Pirata dos mares</div></div><div class="level" id="level">Nv. 1</div></div>
    <div class="row tiny"><span>VIDA</span><span id="hpText"></span></div><div class="bar"><i id="hpBar"></i></div>
    <div class="row tiny"><span>ENERGIA</span><span id="enText"></span></div><div class="bar energy"><i id="enBar"></i></div>
    <div class="row wallet"><span class="money">◈ <span id="coins">0</span></span><span class="fruitBadge"><span id="fruitMini">🔥</span><b id="fruitName">Flame</b></span></div>
    <div class="row tiny"><span>EXPERIÊNCIA</span><span id="xpText"></span></div><div class="bar xp"><i id="xpBar"></i></div>
  </section>

  <button class="quest card" id="questBox">
    <span class="eyebrow">MISSÃO ATUAL</span><b id="questTitle">Porto Aurora</b>
    <div class="questText" id="questText"></div><div class="questMeta"><span id="questLevel">Nv. recomendado 1+</span><span id="questCount">0/5</span></div>
    <div class="questProgress"><i id="questProgress"></i></div>
  </button>

  <section class="minimapCard card">
    <div class="minimapTitle"><span>MAPA LOCAL</span><b id="miniSea">SEA 1</b></div><canvas id="minimap"></canvas>
  </section>

  <div class="boss card" id="bossBox"><div class="row"><b id="bossName"></b><span id="bossHpText" class="tiny"></span></div><div class="bar"><i id="bossBar"></i></div></div>
  <div class="locationBanner card" id="locationBanner"><b id="locationName">Porto Aurora</b><span id="locationSub">1º SEA • NÍVEL 1+</span></div>

  <div class="hotbar card">
    <button class="slot" id="attackBtn"><em>SPACE</em><strong>⚔</strong><span id="weaponName">Katana</span></button>
    <button class="slot fruitSlot" data-skill="0"><em>Z</em><strong id="skillIcon0">✦</strong><span id="skill0">Disparo</span></button>
    <button class="slot fruitSlot" data-skill="1"><em>X</em><strong id="skillIcon1">◉</strong><span id="skill1">Explosão</span></button>
    <button class="slot fruitSlot" data-skill="2"><em>C</em><strong id="skillIcon2">✹</strong><span id="skill2">Domínio</span></button>
    <button class="slot" id="dashBtn"><em>Q</em><strong>➜</strong><span>Dash</span></button>
  </div>

  <div class="nav">
    <button id="bagBtn"><b>🎒</b>Mochila</button><button id="spinBtn"><b>✦</b>Girar fruta</button>
    <button id="mapBtn"><b>🗺</b>Mapa</button><button id="boatBtn"><b>⛵</b>Barco</button>
  </div>
  <div id="toastbox" class="toastbox"></div>
  <div id="mobile"><div id="stickbase" class="stickbase"><div id="stick" class="stick"></div></div><button id="mobileAtk" class="atk">⚔</button></div>
</div>

<div class="modalShade" id="modalShade"><section class="modal"><div class="modalHead"><h2 id="modalTitle">Menu</h2><button id="modalClose">✕</button></div><div id="modalBody" class="modalBody"></div></section></div>

function buildProps(){
  props=[];
  islands.forEach((q,i)=>{
    let count=q.sea===2?34:26;
    for(let j=0;j<count;j++){
      let a=rnd(i*100+j)*TAU,rr=.15+rnd(i*300+j)*.58;
      let x=q.x+Math.cos(a)*q.rx*rr,y=q.y+Math.sin(a)*q.ry*rr;
      let type='tree';
      if(q.biome==='desert')type=rnd(j+i)<.58?'cactus':'rock';
      else if(q.biome==='ice'||q.biome==='frostfire')type=rnd(j+i)<.55?'pine':'crystal';
      else if(q.biome==='grave')type=rnd(j+i)<.48?'grave':'dead';
      else if(q.biome==='wreck')type=rnd(j+i)<.5?'wreck':'rock';
      else if(rnd(j+i)<.25)type='rock';
      props.push({x,y,type,i,scale:.7+rnd(j*7+i)*.7});
    }
    for(let h=0;h<(q.sea===2?5:3);h++){
      let a=(h/(q.sea===2?5:3))*TAU+.4,x=q.x+Math.cos(a)*q.rx*.32,y=q.y+Math.sin(a)*q.ry*.25;
      props.push({x,y,type:q.biome==='grave'?'crypt':q.biome==='wreck'?'wreck':'house',i,scale:1});
    }
    props.push({x:q.x+q.rx*.78,y:q.y+q.ry*.08,type:'dock',i,scale:1});
  });
}

function kill(e){
  let i=e.home,q=islands[i];s.coins+=e.boss?450+i*160:35+i*12;gainXp(e.boss?260+i*120:45+i*18);e.resp=e.boss?40:12;

function update(dt){
  worldTime+=dt;p.atk=Math.max(0,p.atk-dt);p.inv=Math.max(0,p.inv-dt);p.dash=Math.max(0,p.dash-dt);p.dashCd=Math.max(0,p.dashCd-dt);for(let c=0;c<3;c++)p.cd[c]=Math.max(0,p.cd[c]-dt);p.en=Math.min(maxEn(),p.en+18*dt);

  if(l>0){mx/=l;my/=l;p.angle=Math.atan2(my,mx);let sp=(s.boat?280:185)*(p.dash>0?2.5:1),nx=clamp(p.x+mx*sp*dt,25,WORLD.w-25),ny=clamp(p.y+my*sp*dt,25,WORLD.h-25);

  hudTimer+=dt;if(hudTimer>.12){hudTimer=0;hud();drawMinimap()}
}

}
function drawPlayer(){
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
  if(s.boat){ctx.globalAlpha=.18;ellipse(3,15,28,10,'#00151f');ctx.globalAlpha=1;ctx.fillStyle='#8b603d';ctx.beginPath();ctx.moveTo(-28,-11);ctx.lineTo(29,-11);ctx.lineTo(19,15);ctx.lineTo(-18,15);ctx.closePath();ctx.fill();ctx.fillStyle='#5c3e2d';ctx.fillRect(-2,-38,4,29);ctx.fillStyle='#fff0c6';ctx.beginPath();ctx.moveTo(1,-37);ctx.lineTo(1,-10);ctx.lineTo(27,-10);ctx.closePath();ctx.fill();ctx.strokeStyle='#d9bc82';ctx.stroke()}
  else{ctx.globalAlpha=.2;ellipse(2,13,17,6,'#00151f');ctx.globalAlpha=1;ctx.fillStyle='#173f50';ctx.fillRect(-10,-4,20,20);ctx.fillStyle='#f1d2a1';ctx.beginPath();ctx.arc(0,-8,10,0,TAU);ctx.fill();ctx.fillStyle='#14242d';ellipse(-3,-10,1.5,1.5,'#14242d');ellipse(3,-10,1.5,1.5,'#14242d');
    ctx.strokeStyle=s.hakiArm?'#8b70d8':'#e9eef0';ctx.lineWidth=s.hakiArm?7:4;ctx.beginPath();ctx.moveTo(9,1);ctx.lineTo(32,0);ctx.stroke();if(s.hakiArm){ctx.strokeStyle='#c7afff66';ctx.lineWidth=2;ctx.stroke()}
    let fc=fruitColor(s.fruit);ctx.strokeStyle=fc;ctx.globalAlpha=.35;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,20+Math.sin(worldTime*4)*2,0,TAU);ctx.stroke();ctx.globalAlpha=1}
  ctx.restore()
}
function drawFX(){
  projectiles.forEach(pr=>{ctx.save();ctx.shadowColor=pr.c;ctx.shadowBlur=18;ellipse(pr.x,pr.y,pr.r,pr.r,pr.c);ellipse(pr.x-3,pr.y-3,pr.r*.42,pr.r*.42,'#fff8df');ctx.restore()});
  fx.forEach(f=>{let a=clamp(f.t/.7,0,1);ctx.save();ctx.globalAlpha=Math.min(1,a*1.7);ctx.strokeStyle=f.c;ctx.fillStyle=f.c;
    if(f.type==='spark')ellipse(f.x,f.y,f.r*a,f.r*a,f.c);
    else if(f.type==='slash'){ctx.lineWidth=7*a+2;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1.15-a*.15),f.a-.9,f.a+.9);ctx.stroke()}
    else if(f.type==='dash'){ctx.lineWidth=5*a;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1-a*.5),0,TAU);ctx.stroke()}
    else{let progress=1-a,rad=f.r*(.35+.65*progress);ctx.lineWidth=(f.type==='domain'?12:7)*a+1;ctx.beginPath();ctx.arc(f.x,f.y,rad,0,TAU);ctx.stroke();ctx.globalAlpha=.07*a;ellipse(f.x,f.y,rad,rad,f.c)}
    ctx.restore()})
}
function draw(){
  let r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ocean(r);ctx.save();ctx.translate(r.width/2-cam.x,r.height/2-cam.y);
  let vw=r.width,vh=r.height;islands.forEach((q,i)=>{if(Math.abs(q.x-cam.x)<vw/2+q.rx+120&&Math.abs(q.y-cam.y)<vh/2+q.ry+120)drawIsland(q,i)});
  let visible=o=>Math.abs(o.x-cam.x)<vw/2+120&&Math.abs(o.y-cam.y)<vh/2+120;
  let drawables=[];props.forEach(o=>{if(visible(o))drawables.push({y:o.y,fn:()=>drawProp(o)})});enemies.forEach(e=>{if(e.hp>0&&visible(e)&&islands[e.home].sea===seaOf(p.x))drawables.push({y:e.y,fn:()=>drawEnemy(e)})});drawables.push({y:p.y,fn:drawPlayer});drawables.sort((a,b)=>a.y-b.y).forEach(o=>o.fn());
  if(s.hakiObs){ctx.save();ctx.strokeStyle='#ffd36f88';ctx.setLineDash([6,5]);enemies.forEach(e=>{if(e.hp>0&&dist(e,p)<650){ctx.beginPath();ctx.arc(e.x,e.y,e.boss?34:23,0,TAU);ctx.stroke()}});ctx.restore()}
  drawFX();ctx.restore();
  let near=enemies.find(e=>e.boss&&e.hp>0&&dist(e,p)<680);$('bossBox').style.display=near?'block':'none';if(near){$('bossName').textContent=islands[near.home].boss;$('bossHpText').textContent=Math.ceil(near.hp)+' / '+near.max;$('bossBar').style.width=near.hp/near.max*100+'%'}
}
function drawMinimap(){
  let w=mini.width,h=mini.height;mctx.clearRect(0,0,w,h);let sea=seaOf(p.x),seaIs=islands.filter(q=>q.sea===sea),minX=Math.min(...seaIs.map(q=>q.x-q.rx)),maxX=Math.max(...seaIs.map(q=>q.x+q.rx)),minY=Math.min(...seaIs.map(q=>q.y-q.ry)),maxY=Math.max(...seaIs.map(q=>q.y+q.ry));
  let sx=w/(maxX-minX+700),sy=h/(maxY-minY+500),sc=Math.min(sx,sy),ox=(w-(maxX-minX)*sc)/2-minX*sc,oy=(h-(maxY-minY)*sc)/2-minY*sc;
  let g=mctx.createLinearGradient(0,0,0,h);g.addColorStop(0,sea===1?'#2d96b4':'#257aa2');g.addColorStop(1,sea===1?'#105b7e':'#103f69');mctx.fillStyle=g;mctx.fillRect(0,0,w,h);
  seaIs.forEach(q=>{mctx.fillStyle=q.c1;mctx.beginPath();mctx.ellipse(q.x*sc+ox,q.y*sc+oy,q.rx*sc,q.ry*sc,0,0,TAU);mctx.fill();mctx.fillStyle=q.c2;mctx.beginPath();mctx.ellipse(q.x*sc+ox,q.y*sc+oy,q.rx*sc*.82,q.ry*sc*.8,0,0,TAU);mctx.fill()});
  mctx.fillStyle='#ffd36f';mctx.beginPath();mctx.arc(p.x*sc+ox,p.y*sc+oy,6,0,TAU);mctx.fill();mctx.strokeStyle='#fff';mctx.lineWidth=2;mctx.stroke()
}
function loop(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;if(!modal)update(dt);draw();requestAnimationFrame(loop)}
function openModal(title,body){modal=true;$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalShade').classList.add('open')}
function closeModal(){modal=false;spinBusy=false;$('modalShade').classList.remove('open');save()}
function rarityClass(n){return'r'+(rarity[n]||1)}
function bag(){
  let f=s.ownedFruits.map(n=>'<div class="item"><span class="tag '+rarityClass(n)+'">'+rarityName[rarity[n]]+'</span><h3>'+(fruitIcon[n]||'✦')+' '+n+'</h3><p>Poder elemental. Raridade '+rarity[n]+'/5.</p><button data-equip-fruit="'+n+'" '+(s.fruit===n?'disabled':'')+'>'+(s.fruit===n?'Equipada':'Equipar fruta')+'</button></div>').join('');
  let w=s.ownedWeapons.map(i=>'<div class="item"><span class="tag">ESPADA</span><h3>⚔ '+swords[i]+'</h3><p>Dano base aumenta conforme a espada equipada.</p><button data-equip-weapon="'+i+'" '+(s.weapon===i?'disabled':'')+'>'+(s.weapon===i?'Equipada':'Equipar espada')+'</button></div>').join('');
  let g=s.ownedGear.map(n=>{let b=gear[n]||{};return'<div class="item"><span class="tag">DROP DE BOSS</span><h3>◆ '+n+'</h3><p>'+(b.hp?'+'+b.hp+' HP ':'')+(b.en?'+'+b.en+' energia ':'')+(b.dmg?'• bônus de dano':'')+'</p><button data-equip-gear="'+n+'" '+(s.equipment===n?'disabled':'')+'>'+(s.equipment===n?'Equipado':'Equipar')+'</button></div>'}).join('');
  openModal('Mochila','<div class="sectionTitle">Frutas</div><div class="grid">'+f+'</div><div class="sectionTitle">Espadas</div><div class="grid">'+w+'</div><div class="sectionTitle">Equipamentos</div><div class="grid">'+(g||'<div class="item"><h3>Nenhum equipamento ainda</h3><p>Derrote bosses para conseguir drops especiais.</p></div>')+'</div>')
}
function spinMenu(){
  let cost=500+Math.floor(s.level/20)*150;openModal('Giro de Fruta','<div class="spinStage"><span class="eyebrow">MERCADOR MISTERIOSO</span><div class="spinMachine"><div><div class="spinFruit" id="spinFruit">✦</div><div class="spinName" id="spinName">Fruta misteriosa</div></div></div><div class="spinCost">Custo do giro: <b class="gold">◈ '+cost.toLocaleString('pt-BR')+'</b> • Seu saldo: ◈ '+Math.floor(s.coins).toLocaleString('pt-BR')+'</div><button class="primaryBtn" data-spin="1" '+(s.coins<cost?'disabled':'')+'>GIRAR FRUTA</button></div>')
}
function doSpin(btn){
  if(spinBusy)return;let cost=500+Math.floor(s.level/20)*150;if(s.coins<cost){toast('Moedas insuficientes','bad');return}spinBusy=true;btn.disabled=true;s.coins-=cost;
  let pool=[];fruits.forEach(f=>{let rr=rarity[f]||1,w=Math.max(1,8-rr);for(let i=0;i<w*w;i++)pool.push(f)});
  let ticks=0,total=24+Math.floor(Math.random()*10),el=$('spinFruit'),nm=$('spinName'),timer=setInterval(()=>{let f=pool[Math.floor(Math.random()*pool.length)];if(el)el.textContent=fruitIcon[f]||'✦';if(nm)nm.textContent=f;ticks++;if(ticks>=total){clearInterval(timer);let f=pool[Math.floor(Math.random()*pool.length)];if(!s.ownedFruits.includes(f))s.ownedFruits.push(f);s.fruit=f;if(el)el.textContent=fruitIcon[f]||'✦';if(nm){nm.textContent=f+' • '+rarityName[rarity[f]];nm.className='spinName '+rarityClass(f)}toast('VOCÊ GIROU • '+f,'good');spinBusy=false;save();hud();setTimeout(()=>spinMenu(),900)}},75+ticks*3)
}
function map(){
  let cards='';[1,2].forEach(sea=>{cards+='<div class="mapSea">'+sea+'º Sea</div><div class="grid">';islands.forEach((q,i)=>{if(q.sea!==sea)return;let lock=s.level<q.min;cards+='<div class="item '+(lock?'locked':'')+'"><span class="tag">'+q.biome.toUpperCase()+'</span><h3>'+q.name+'</h3><p>Nível '+q.min+'+<br>Boss: '+q.boss+'<br>Drop: '+q.drop+'</p><button data-travel="'+i+'" '+(lock?'disabled':'')+'>'+(lock?'Bloqueada':'Viajar')+'</button></div>'});cards+='</div>'});openModal('Mapa dos Mares',cards+'<p class="tiny" style="margin-top:16px">O 2º Sea começa no nível 50. Suas ilhas são maiores e ficam mais distantes entre si.</p>')
}
$('modalBody').addEventListener('click',e=>{let t=e.target;if(t.dataset.spin)doSpin(t);if(t.dataset.equipFruit){s.fruit=t.dataset.equipFruit;save();hud();bag()}if(t.dataset.equipWeapon!==undefined){s.weapon=+t.dataset.equipWeapon;save();hud();bag()}if(t.dataset.equipGear){s.equipment=t.dataset.equipGear;p.hp=Math.min(p.hp,maxHp());p.en=Math.min(p.en,maxEn());save();bag()}if(t.dataset.travel!==undefined){let i=+t.dataset.travel,q=islands[i];if(s.level>=q.min){p.x=q.x;p.y=q.y;s.boat=false;closeModal();toast('VIAJOU PARA • '+q.name,'good')}}});
$('bagBtn').onclick=bag;$('spinBtn').onclick=spinMenu;$('mapBtn').onclick=map;$('modalClose').onclick=closeModal;$('attackBtn').onclick=attack;$('dashBtn').onclick=dash;document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>skill(+b.dataset.skill));
$('boatBtn').onclick=()=>{s.boat=!s.boat;toast(s.boat?'Barco chamado • navegue pelo oceano.':'Você desembarcou.');save()};
function hakiArm(){s.hakiArm=!s.hakiArm;toast('Armamento '+(s.hakiArm?'ativado':'desativado'));save();hud()}function hakiObs(){s.hakiObs=!s.hakiObs;toast('Observação '+(s.hakiObs?'ativada':'desativada'));save();hud()}
$('hakiArm').onclick=hakiArm;$('hakiObs').onclick=hakiObs;
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(modal&&e.code==='Escape'){closeModal();return}keys[e.code]=true;if(e.repeat||modal)return;if(e.code==='Space')attack();if(e.code==='KeyZ')skill(0);if(e.code==='KeyX')skill(1);if(e.code==='KeyC')skill(2);if(e.code==='KeyQ')dash();if(e.code==='KeyF')hakiArm();if(e.code==='KeyG')hakiObs();if(e.code==='KeyM')map();if(e.code==='KeyB')bag()});window.addEventListener('keyup',e=>keys[e.code]=false);
let sb=$('stickbase'),stick=$('stick');function jm(e){if(e.pointerId!==joy.id)return;let r=sb.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=r.width*.32,d=Math.hypot(x,y);if(d>m){x=x/d*m;y=y/d*m}joy.x=x/m;joy.y=y/m;stick.style.transform='translate('+x+'px,'+y+'px)'}sb.addEventListener('pointerdown',e=>{joy.id=e.pointerId;sb.setPointerCapture(e.pointerId);jm(e)});sb.addEventListener('pointermove',jm);function je(e){if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;stick.style.transform=''}}sb.addEventListener('pointerup',je);sb.addEventListener('pointercancel',je);$('mobileAtk').onpointerdown=attack;
if(matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0)document.body.classList.add('touch');
window.addEventListener('resize',resize);window.addEventListener('pagehide',save);resize();hud();drawMinimap();requestAnimationFrame(loop);
window.FruitSeasGame={getState(){save();return JSON.parse(JSON.stringify(s))},getView(){return{x:p.x,y:p.y,angle:p.angle,boat:s.boat,level:s.level,fruit:s.fruit,camX:cam.x,camY:cam.y,zoom:1,sea:seaOf(p.x)}},getCatalog(){return{islands,fruits}},toast};
})();
